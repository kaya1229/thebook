<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Cinematic Oracle</title>
    <style>
        /* 전체 글씨체: 궁서체 */
        body, input, textarea, button, h1, h2, h3 {
            font-family: 'Gungsuh', '궁서', 'AppleMyungjo', serif;
        }

        :root {
            --book-w: 340px; --book-h: 480px; --book-t: 64px;
            --cover-color: #161b22; --gold: #d4af37; --ivory: #fcf9f2;
        }

        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        body {
            background-color: #050505; color: var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; perspective: 2500px; overflow: hidden;
        }

        .header-ui { position: absolute; top: 8%; text-align: center; z-index: 100; transition: 0.8s; }
        .input-box { background: transparent; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4); color: #fff; padding: 12px; width: 350px; text-align: center; font-size: 1.1rem; outline: none; margin-bottom: 20px; }
        .btn-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px 20px; cursor: pointer; letter-spacing: 2px; transition: 0.4s; font-size: 0.8rem; margin: 5px; }
        .btn-gold:hover { background: var(--gold); color: #000; }

        /* 다시 질문하기 버튼 */
        #retry-btn { position: absolute; bottom: 8%; opacity: 0; pointer-events: none; transition: opacity 1s ease 2.5s; z-index: 200; }
        #retry-btn.show { opacity: 1; pointer-events: auto; }

        /* 3D 책 구조 */
        .book-container { width: var(--book-w); height: var(--book-h); position: relative; transform-style: preserve-3d; transition: 2.5s; transform: rotateY(-25deg) rotateX(12deg); }
        .part { position: absolute; background: var(--cover-color); transform-style: preserve-3d; backface-visibility: hidden; }
        .front { width: 100%; height: 100%; transform: translateZ(calc(var(--book-t) / 2)); z-index: 10; border-radius: 0 4px 4px 0; transform-origin: left; transition: 2s; display: flex; align-items: center; justify-content: center; }
        .spine { width: var(--book-t); height: 100%; left: calc(var(--book-t) / -2); transform: rotateY(-90deg); background: #0c1117; }
        .side-paper { background: #e2ded0; width: calc(var(--book-t) - 2px); height: calc(100% - 4px); right: calc(var(--book-t) / -2); top: 2px; transform: rotateY(90deg); }
        .page-inner { position: absolute; width: 100%; height: 100%; background: var(--ivory); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; color: #1a1a1a; opacity: 0; transition: opacity 0.8s ease 1.2s; }
        .left-content { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }
        .right-content { border-radius: 0 4px 4px 0; border-left: 1px solid rgba(0,0,0,0.1); }
        .book-container.active { transform: rotateY(0deg) rotateX(0deg) translateZ(150px) translateX(50%) translateY(-10%); }
        .book-container.active .front { transform: translateZ(calc(var(--book-t) / 2)) rotateY(-175deg); }
        .book-container.active .page-inner { opacity: 1; }

        /* 관리자 패널 */
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.98); border: 1px solid var(--gold); padding: 25px; z-index: 1000; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto; color: #eee; }
        .search-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; max-height: 200px; overflow-y: auto; background: #111; padding: 10px; }
        .search-item { cursor: pointer; border: 2px solid transparent; text-align: center; font-size: 0.7rem; }
        .search-item.selected { border-color: var(--gold); }
        .search-item img { width: 100%; }
        .admin-trigger { position: fixed; bottom: 0; right: 0; width: 40px; height: 40px; opacity: 0; z-index: 999; }
    </style>
</head>
<body>

<div class="header-ui" id="ui-main">
    <h1>The Oracle</h1>
    <input type="text" id="q-input" class="input-box" placeholder="무엇이 궁금하십니까?">
    <div>
        <button class="btn-gold" onclick="launch('random')">무작위의 해답</button>
        <button class="btn-gold" onclick="launch('manual')">직접 찾기</button>
    </div>
</div>

<div class="book-container" id="oracle-book">
    <div class="part spine"></div>
    <div class="part side-paper"></div>
    <div class="page-inner right-content"><div id="res-msg" style="font-size: 1.6rem; text-align: center; line-height: 1.6;"></div></div>
    <div class="part front">
        <div id="cover-art" style="text-align: center; border: 1px solid var(--gold); padding: 40px;">
            <h2 style="font-size: 2.5rem; font-weight: 300;">解答</h2>
            <p style="font-style: italic; opacity: 0.6;">The Book of Destiny</p>
        </div>
        <div class="page-inner left-content">
            <img id="res-poster" style="max-width: 85%; max-height: 70%; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
            <p id="res-title" style="margin-top: 15px; font-style: italic; color: #777; font-size: 0.9rem;"></p>
        </div>
    </div>
</div>

<div id="retry-btn">
    <button class="btn-gold" onclick="resetOracle()">다시 질문하기</button>
</div>

<div class="admin-trigger" onclick="checkAdmin()"></div>

<div id="admin-panel">
    <!-- 관리자 기능 코드는 이전과 동일하게 유지 -->
    <h3 style="color: var(--gold);">ADMIN CONSOLE</h3>
    <input type="text" id="tmdb-query" placeholder="드라마 제목 검색..." style="width:70%; padding:8px;">
    <button class="btn-gold" onclick="searchTMDB()">검색</button>
    <div id="search-results" class="search-results"></div>
    <input type="text" id="selected-title" placeholder="선택된 제목" readonly style="width:100%; margin:10px 0; padding:8px;">
    <input type="hidden" id="selected-poster">
    <textarea id="manual-answer" placeholder="해답 문구" rows="3" style="width:100%; margin-bottom:10px; padding:8px;"></textarea>
    <button class="btn-gold" style="width:100%" onclick="handleSave()">저장</button>
    <div id="list-container" style="margin-top:20px;"></div>
    <button class="btn-gold" style="width:100%; border-color:#444;" onclick="document.getElementById('admin-panel').style.display='none'">닫기</button>
</div>

<script>
    let dataPool = [];

    window.onload = loadData;

    async function loadData() {
        const res = await fetch('/api/dramas');
        dataPool = await res.json();
        renderAdminList();
    }

    function checkAdmin() { if (prompt("암호") === "1234") document.getElementById('admin-panel').style.display='block'; }

    // [피셔-예이츠 셔플 알고리즘: 데이터를 무작위로 섞음]
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function launch(mode) {
        const q = document.getElementById('q-input').value;
        if (!q) return alert("당신의 질문을 먼저 적어주세요.");
        if (dataPool.length === 0) return alert("해답이 준비되지 않았습니다.");

        let result;

        if (mode === 'random') {
            result = dataPool[Math.floor(Math.random() * dataPool.length)];
        } else {
            // [직접 찾기 로직]
            const count = dataPool.length;
            const numStr = prompt(`1부터 ${count} 사이의 숫자를 입력하여 운명의 페이지를 펼치세요.`);
            const num = parseInt(numStr);

            if (isNaN(num) || num < 1 || num > count) {
                return alert(`1부터 ${count} 사이의 유효한 숫자를 입력해주세요.`);
            }

            // 매번 데이터를 섞어서 같은 번호라도 다른 결과가 나오게 함
            const shuffledPool = shuffle([...dataPool]); 
            result = shuffledPool[num - 1]; // 사용자가 고른 순서의 데이터 선택
        }

        // 결과 반영 및 애니메이션
        document.getElementById('res-poster').src = result.poster_url;
        document.getElementById('res-title').innerText = result.title;
        document.getElementById('res-msg').innerText = result.answer;

        document.getElementById('ui-main').style.opacity = '0';
        document.getElementById('oracle-book').classList.add('active');
        document.getElementById('retry-btn').classList.add('show');
        setTimeout(() => { document.getElementById('cover-art').style.visibility = 'hidden'; }, 1500);
    }

    function resetOracle() {
        document.getElementById('q-input').value = "";
        document.getElementById('oracle-book').classList.remove('active');
        document.getElementById('retry-btn').classList.remove('show');
        document.getElementById('ui-main').style.opacity = '1';
        setTimeout(() => { document.getElementById('cover-art').style.visibility = 'visible'; }, 1000);
    }

    // 관리자 관련 나머지 함수들 (생략 없이 유지)
    async function searchTMDB() {
        const q = document.getElementById('tmdb-query').value;
        const res = await fetch(`/api/search?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        document.getElementById('search-results').innerHTML = data.results.map(item => `
            <div class="search-item" onclick="selectDrama('${item.title || item.name}', '${item.poster_path}')">
                <img src="https://image.tmdb.org/t/p/w200${item.poster_path}">
                <p style="margin:5px 0;">${item.title || item.name}</p>
            </div>
        `).join('');
    }
    function selectDrama(t, p) {
        document.getElementById('selected-title').value = t;
        document.getElementById('selected-poster').value = `https://image.tmdb.org/t/p/w500${p}`;
        document.querySelectorAll('.search-item').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }
    async function handleSave() {
        const title = document.getElementById('selected-title').value;
        const poster_url = document.getElementById('selected-poster').value;
        const answer = document.getElementById('manual-answer').value;
        await fetch('/api/dramas', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, answer, poster_url})
        });
        alert("저장완료");
        loadData();
    }
    function renderAdminList() {
        document.getElementById('list-container').innerHTML = dataPool.map(item => `
            <div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:5px;">
                <span>${item.title}</span>
                <button onclick="deleteItem('${item.id}')" style="color:red; background:none; border:none; cursor:pointer;">삭제</button>
            </div>
        `).join('');
    }
    async function deleteItem(id) {
        if(confirm("삭제?")) { await fetch(`/api/dramas?id=${id}`, {method:'DELETE'}); loadData(); }
    }
</script>
</body>
</html>
