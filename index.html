<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Oracle of Dramas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:italic&family=Noto+Serif+KR:wght@300;400;700&display=swap');

        :root {
            --book-width: 380px;
            --book-height: 520px;
            --cover-color: #1a2a3a;
            --ivory-page: #fdfaf2;
        }

        body {
            background-color: #0f0f0f;
            color: #d4af37; /* 골드 톤 */
            font-family: 'Noto Serif KR', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 1. 우아하고 지적인 입력창 & 버튼 */
        .ui-header {
            text-align: center;
            margin-bottom: 60px;
            transition: all 1s ease;
        }

        h1 {
            font-family: 'Libre Baskerville', serif;
            font-style: italic;
            font-size: 2.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-group {
            position: relative;
            margin: 20px 0;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 1px solid #d4af37;
            color: #fff;
            padding: 12px 5px;
            width: 350px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            font-family: 'Noto Serif KR', serif;
        }

        .btn-elegant {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 25px;
            margin: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.4s;
            text-transform: uppercase;
        }

        .btn-elegant:hover {
            background: #d4af37;
            color: #000;
        }

        /* 2. 책 구조 및 중앙 정렬 */
        .stage {
            perspective: 2500px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .book {
            width: var(--book-width);
            height: var(--book-height);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotateY(-25deg) rotateX(5deg);
        }

        .page-base {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background: var(--ivory-page);
            transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 3px 0 30px rgba(0,0,0,0.1), 5px 5px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 내용 중앙 정렬 */
            padding: 40px;
            box-sizing: border-box;
            backface-visibility: hidden;
        }

        /* 표지 */
        .cover-front {
            background: var(--cover-color);
            z-index: 10;
            color: #d4af37;
            border: 1px solid #d4af37;
            border-radius: 0 4px 4px 0;
        }

        /* 여러 장 넘어가는 효과를 위한 가짜 페이지들 */
        .p-fake { z-index: 9; transition-delay: 0.1s; }
        .p-fake-2 { z-index: 8; transition-delay: 0.2s; }

        /* 실제 결과 페이지 */
        .page-result-left {
            transform: rotateY(0deg); /* 닫혔을 때 숨겨짐 */
            z-index: 5;
            background: var(--ivory-page);
            border-radius: 4px 0 0 4px;
        }

        .page-result-right {
            z-index: 4;
            border-radius: 0 4px 4px 0;
            border-left: 1px solid #ddd;
        }

        /* 펼쳐진 상태 애니메이션 */
        .book.opened {
            transform: rotateY(0deg) rotateX(0deg); /* 책을 화면 정중앙으로 */
        }
        .book.opened .cover-front { transform: rotateY(-170deg); }
        .book.opened .p-fake { transform: rotateY(-160deg); }
        .book.opened .p-fake-2 { transform: rotateY(-150deg); }
        
        /* 결과 콘텐츠 스타일 */
        .poster-frame {
            width: 100%;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .poster-frame img {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .answer-text {
            font-family: "Gungsuh", "궁서", serif;
            font-size: 2rem;
            line-height: 1.6;
            color: #1a1a1a;
            text-align: center;
            word-break: keep-all;
        }

        #page-manual-input {
            display: none;
            margin-top: 15px;
            animation: fadeIn 1s;
        }
    </style>
</head>
<body>

<div class="ui-header" id="header">
    <h1>The Oracle of Dramas</h1>
    <div class="input-group">
        <input type="text" id="user-q" placeholder="무엇이 당신을 망설이게 하나요?">
    </div>
    <div id="main-btns">
        <button class="btn-elegant" onclick="handleStart('random')">기록된 운명 따르기</button>
        <button class="btn-elegant" onclick="showManual()">페이지 지정하기</button>
    </div>
    <div id="page-manual-input">
        <input type="number" id="page-num" placeholder="1-500" style="width: 80px; background: transparent; border: 1px solid #d4af37; color: #fff; padding: 5px; text-align: center;">
        <button class="btn-elegant" onclick="handleStart('manual')">펼치기</button>
    </div>
</div>

<div class="stage">
    <div class="book" id="book-obj">
        <!-- 책등 (Spine) -->
        <div style="position: absolute; width: 40px; height: 100%; left: -20px; background: #121d29; transform: rotateY(90deg); z-index: 11;"></div>

        <!-- 가짜 페이지들 (넘어가는 느낌용) -->
        <div class="page-base p-fake"></div>
        <div class="page-base p-fake-2"></div>

        <!-- 결과: 왼쪽 페이지 (중앙 정렬) -->
        <div class="page-base page-result-left" id="p-left" style="transform-origin: right; left: -100%;">
            <div class="poster-frame">
                <img id="res-poster" src="">
            </div>
            <p id="res-title" style="margin-top: 20px; color: #888; font-style: italic;"></p>
        </div>

        <!-- 결과: 오른쪽 페이지 (중앙 정렬) -->
        <div class="page-base page-result-right">
            <div id="res-msg" class="answer-text"></div>
        </div>

        <!-- 표지 -->
        <div class="page-base cover-front" id="cover">
            <div style="border: 1px solid #d4af37; padding: 30px; text-align: center;">
                <p style="font-size: 0.8rem; letter-spacing: 5px;">COLLECTED WISDOM</p>
                <p style="font-size: 2.5rem; margin: 10px 0;">解答</p>
            </div>
        </div>
    </div>
</div>

<script>
    const dramaLibrary = [
        { t: "랑야방", m: "치밀하게 설계하고\n침묵으로 실행하라.", p: "https://via.placeholder.com/220x320/1a2a3a/d4af37?text=Nirvana+In+Fire" },
        { t: "강철삼림", m: "결국 모든 것은 타이밍이다.\n망설이지 마라.", p: "https://via.placeholder.com/220x320/1a2a3a/d4af37?text=Steel+Forest" },
        { t: "창란결", m: "때로는 차가운 거절이\n가장 큰 보호가 된다.", p: "https://via.placeholder.com/220x320/1a2a3a/d4af37?text=Love+Between+Fairy" },
        { t: "미생", m: "죽어있는 수라면\n과감히 버려라.", p: "https://via.placeholder.com/220x320/1a2a3a/d4af37?text=Misaeng" }
    ];

    function showManual() {
        document.getElementById('main-btns').style.display = 'none';
        document.getElementById('page-manual-input').style.display = 'block';
    }

    function handleStart(mode) {
        const q = document.getElementById('user-q').value;
        if(!q) { alert("질문을 입력해 주세요."); return; }

        let seed = mode === 'random' ? Math.floor(Math.random()*500) : document.getElementById('page-num').value;
        const res = dramaLibrary[seed % dramaLibrary.length];

        // 데이터 세팅
        document.getElementById('res-poster').src = res.p;
        document.getElementById('res-title').innerText = res.t;
        document.getElementById('res-msg').innerText = `"${res.m}"`;

        // UI 변화 및 책 펼치기
        document.getElementById('header').style.opacity = '0.2';
        document.getElementById('book-obj').classList.add('opened');
        
        // 결과 페이지 노출 타이밍 (애니메이션 중간에)
        setTimeout(() => {
            document.getElementById('p-left').style.zIndex = "12";
        }, 800);
    }
</script>

</body>
</html>
