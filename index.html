<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Cinematic Oracle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:italic&family=Noto+Serif+KR:wght@300;700&display=swap');

        :root {
            --book-w: 340px; --book-h: 480px; --book-t: 64px;
            --cover-color: #161b22; --gold: #d4af37; --ivory: #fcf9f2;
        }

        body {
            background-color: #050505; color: var(--gold); font-family: 'Noto Serif KR', serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; perspective: 2500px; overflow: hidden;
        }

        /* 메인 UI */
        .header-ui { position: absolute; top: 8%; text-align: center; z-index: 100; transition: 0.8s; }
        .input-box { background: transparent; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4); color: #fff; padding: 12px; width: 350px; text-align: center; font-size: 1.1rem; outline: none; margin-bottom: 20px; }
        .btn-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px 20px; cursor: pointer; letter-spacing: 2px; transition: 0.4s; font-size: 0.8rem; }
        .btn-gold:hover { background: var(--gold); color: #000; }

        /* 3D 책 구조 */
        .book-container { width: var(--book-w); height: var(--book-h); position: relative; transform-style: preserve-3d; transition: 2.5s; transform: rotateY(-25deg) rotateX(12deg); }
        .part { position: absolute; background: var(--cover-color); transform-style: preserve-3d; backface-visibility: hidden; }
        .front { width: 100%; height: 100%; transform: translateZ(calc(var(--book-t) / 2)); z-index: 10; border-radius: 0 4px 4px 0; transform-origin: left; transition: 2s; display: flex; align-items: center; justify-content: center; }
        .spine { width: var(--book-t); height: 100%; left: calc(var(--book-t) / -2); transform: rotateY(-90deg); background: #0c1117; }
        .side-paper { background: #e2ded0; width: calc(var(--book-t) - 2px); height: calc(100% - 4px); right: calc(var(--book-t) / -2); top: 2px; transform: rotateY(90deg); }
        
        .page-inner { position: absolute; width: 100%; height: 100%; background: var(--ivory); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; color: #1a1a1a; opacity: 0; transition: opacity 0.8s ease 1.2s; }
        .left-content { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }
        .right-content { border-radius: 0 4px 4px 0; border-left: 1px solid rgba(0,0,0,0.1); }

        .book-container.active { transform: rotateY(0deg) rotateX(0deg) translateZ(150px) translateX(50%) translateY(-10%); }
        .book-container.active .front { transform: translateZ(calc(var(--book-t) / 2)) rotateY(-175deg); }
        .book-container.active .page-inner { opacity: 1; }

        /* 관리자 패널 스타일 */
        #admin-panel {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.98); border: 1px solid var(--gold); padding: 25px;
            z-index: 1000; border-radius: 12px; width: 450px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 0 50px rgba(0,0,0,1); color: #eee;
        }
        #admin-panel input, #admin-panel textarea { width: 100%; padding: 10px; margin-bottom: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        
        .admin-list { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        .drama-item { display: flex; align-items: center; gap: 12px; background: #222; padding: 8px; margin-bottom: 8px; border-radius: 6px; }
        .drama-item img { width: 40px; height: 55px; object-fit: cover; border-radius: 2px; }
        .item-info { flex: 1; min-width: 0; }
        .item-info p { margin: 0; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-btns { display: flex; gap: 5px; }
        .btn-sm { padding: 4px 8px; font-size: 0.7rem; cursor: pointer; background: none; border: 1px solid var(--gold); color: var(--gold); }
        .btn-del { border-color: #ff4d4d; color: #ff4d4d; }

        .admin-trigger { position: fixed; bottom: 0; right: 0; width: 40px; height: 40px; opacity: 0; cursor: default; z-index: 999; }
    </style>
</head>
<body>

<div class="header-ui" id="ui-main">
    <h1>The Oracle</h1>
    <input type="text" id="q-input" class="input-box" placeholder="무엇이 궁금하십니까?">
    <div>
        <button class="btn-gold" onclick="launch('random')">무작위의 해답</button>
        <button class="btn-gold" onclick="location.reload()">직접 찾기</button>
    </div>
</div>

<div class="book-container" id="oracle-book">
    <div class="part spine"></div>
    <div class="part side-paper"></div>
    <div class="page-inner right-content"><div id="res-msg" class="answer-txt" style="font-size: 1.8rem; text-align: center;"></div></div>
    <div class="part front">
        <div id="cover-art" style="text-align: center; border: 1px solid var(--gold); padding: 40px;">
            <h2 style="font-size: 2.5rem; font-weight: 300;">解答</h2>
            <p style="font-style: italic; opacity: 0.6;">The Book of Destiny</p>
        </div>
        <div class="page-inner left-content" style="position: absolute; width:100%; height:100%; top:0; left:0;">
            <img id="res-poster" style="max-width: 85%; max-height: 70%; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
            <p id="res-title" style="margin-top: 15px; font-style: italic; color: #777; font-size: 0.9rem;"></p>
        </div>
    </div>
</div>

<div class="admin-trigger" onclick="checkAdmin()"></div>

<div id="admin-panel">
    <h3 style="margin-top: 0; color: var(--gold);">ADMIN CONSOLE</h3>
    <input type="hidden" id="edit-id">
    <input type="hidden" id="edit-poster">
    <input type="text" id="tmdb-query" placeholder="드라마 제목 (TMDB 검색)">
    <textarea id="manual-answer" placeholder="해답 문구 입력" rows="3"></textarea>
    
    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
        <button id="save-btn" class="btn-gold" style="flex: 2;" onclick="handleSave()">데이터 저장</button>
        <button class="btn-gold" style="flex: 1; border-color: #666;" onclick="resetForm()">초기화</button>
    </div>

    <div class="admin-list">
        <input type="text" id="list-search" oninput="filterList()" placeholder="목록 내 검색..." style="margin-bottom: 10px;">
        <div id="list-container"></div>
    </div>
    <button class="btn-gold" style="width: 100%; margin-top: 15px; border-color: #444;" onclick="document.getElementById('admin-panel').style.display='none'">닫기</button>
</div>

<script>
    let dataPool = [];
    let rawData = [];

    window.onload = async () => {
        await loadData();
    };

    async function loadData() {
        try {
            const res = await fetch('/api/dramas');
            rawData = await res.json();
            dataPool = rawData.map(d => ({ t: d.title, a: d.answer, p: d.poster_url }));
            renderAdminList(rawData);
        } catch (e) { console.error("데이터 로드 실패"); }
    }

    function checkAdmin() {
        if (prompt("관리자 암호") === "1234") {
            document.getElementById('admin-panel').style.display = 'block';
            loadData();
        }
    }

    async function handleSave() {
        const id = document.getElementById('edit-id').value;
        const query = document.getElementById('tmdb-query').value;
        const answer = document.getElementById('manual-answer').value;
        let poster = document.getElementById('edit-poster').value;

        if (!query || !answer) return alert("내용을 입력하세요.");

        // 신규 등록일 경우 TMDB에서 포스터 가져오기
        if (!id) {
            const sRes = await fetch(`/api/search?query=${encodeURIComponent(query)}`);
            const sData = await sRes.json();
            if (sData.results?.length > 0) {
                poster = `https://image.tmdb.org/t/p/w500${sData.results[0].poster_path}`;
            }
        }

        const method = id ? 'PATCH' : 'POST';
        const url = id ? `/api/dramas?id=${id}` : '/api/dramas';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: query, answer: answer, poster_url: poster })
        });

        if (res.ok) {
            alert(id ? "수정 완료" : "추가 완료");
            resetForm();
            loadData();
        }
    }

    async function deleteItem(id) {
        if (!confirm("정말 삭제할까요?")) return;
        await fetch(`/api/dramas?id=${id}`, { method: 'DELETE' });
        loadData();
    }

    function editMode(id, title, answer, poster) {
        document.getElementById('edit-id').value = id;
        document.getElementById('tmdb-query').value = title;
        document.getElementById('manual-answer').value = answer;
        document.getElementById('edit-poster').value = poster;
        document.getElementById('save-btn').innerText = "내용 수정하기";
        document.getElementById('admin-panel').scrollTo({top:0, behavior:'smooth'});
    }

    function resetForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('tmdb-query').value = "";
        document.getElementById('manual-answer').value = "";
        document.getElementById('edit-poster').value = "";
        document.getElementById('save-btn').innerText = "데이터 저장";
    }

    function renderAdminList(items) {
        document.getElementById('list-container').innerHTML = items.map(item => `
            <div class="drama-item">
                <img src="${item.poster_url || ''}" alt="">
                <div class="item-info">
                    <p><strong>${item.title}</strong></p>
                    <p style="color:#aaa; font-size:0.75rem;">${item.answer}</p>
                </div>
                <div class="item-btns">
                    <button class="btn-sm" onclick="editMode('${item.id}','${item.title}','${item.answer}','${item.poster_url}')">수정</button>
                    <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">삭제</button>
                </div>
            </div>
        `).join('');
    }

    function filterList() {
        const k = document.getElementById('list-search').value.toLowerCase();
        renderAdminList(rawData.filter(d => d.title.toLowerCase().includes(k) || d.answer.toLowerCase().includes(k)));
    }

    function launch(mode) {
        const q = document.getElementById('q-input').value;
        if (!q || dataPool.length === 0) return alert("질문을 입력하세요.");

        const result = dataPool[Math.floor(Math.random() * dataPool.length)];
        document.getElementById('res-poster').src = result.p;
        document.getElementById('res-title').innerText = result.t;
        document.getElementById('res-msg').innerText = `"${result.a}"`;

        document.getElementById('ui-main').style.opacity = '0';
        document.getElementById('oracle-book').classList.add('active');
        setTimeout(() => { document.getElementById('cover-art').style.visibility = 'hidden'; }, 1500);
    }
</script>
</body>
</html>
