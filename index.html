<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Oracle of Dramas - Realistic 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:italic&family=Noto+Serif+KR:wght@300;700&display=swap');

        :root {
            --book-w: 340px;
            --book-h: 480px;
            --book-t: 54px; /* 책 두께 */
            --cover-color: #1c2a38;
            --page-color: #fdfaf2;
            --edge-color: #e5e0d0; /* 종이 옆면 색상 */
        }

        body {
            background-color: #0a0a0a;
            color: #d4af37;
            font-family: 'Noto Serif KR', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            perspective: 2000px;
            overflow: hidden;
        }

        /* 지적인 입력 UI */
        .ui-layer {
            position: absolute;
            top: 10%;
            text-align: center;
            z-index: 100;
            transition: 0.8s ease;
        }

        .ui-layer h1 { font-family: 'Libre Baskerville', serif; font-size: 2.2rem; letter-spacing: 4px; margin-bottom: 30px; }
        
        .input-box {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(212, 175, 55, 0.5);
            color: #fff;
            padding: 10px;
            width: 300px;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            margin-bottom: 20px;
        }

        .btn-gold {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
            font-size: 0.8rem;
        }
        .btn-gold:hover { background: #d4af37; color: #000; }

        /* 3D 책 시스템 */
        .stage {
            width: var(--book-w);
            height: var(--book-h);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
            /* 초기 상태: 약간 비스듬히 놓인 닫힌 책 */
            transform: rotateY(-30deg) rotateX(15deg); 
        }

        .book-part {
            position: absolute;
            background: var(--cover-color);
            box-sizing: border-box;
            backface-visibility: hidden;
        }

        /* 앞표지 */
        .cover-front {
            width: 100%; height: 100%;
            transform: translateZ(calc(var(--book-t) / 2));
            z-index: 10;
            border-radius: 0 4px 4px 0;
            box-shadow: inset -3px 0 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transform-origin: left;
            transition: transform 1.5s ease;
        }

        /* 뒷표지 */
        .cover-back {
            width: 100%; height: 100%;
            transform: rotateY(180deg) translateZ(calc(var(--book-t) / 2));
            border-radius: 4px 0 0 4px;
        }

        /* 책등 (Spine) */
        .spine {
            width: var(--book-t); height: 100%;
            left: calc(var(--book-t) / -2);
            transform: rotateY(-90deg);
            background: #15202b;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* 종이 옆면 (Right, Top, Bottom) */
        .side-paper {
            background: var(--edge-color);
            background-image: linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 2px 100%;
        }
        .side-right {
            width: var(--book-t); height: calc(100% - 4px);
            right: calc(var(--book-t) / -2); top: 2px;
            transform: rotateY(90deg);
        }
        .side-top {
            width: 100%; height: var(--book-t);
            top: calc(var(--book-t) / -2);
            transform: rotateX(90deg);
        }

        /* 내부 페이지 (열렸을 때 노출) */
        .inner-page {
            position: absolute;
            width: calc(100% - 10px);
            height: calc(100% - 10px);
            top: 5px; left: 5px;
            background: var(--page-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            color: #1a1a1a;
            opacity: 0;
            transition: opacity 0.5s ease 1s;
        }

        /* 애니메이션 실행 상태 */
        .stage.open {
            transform: rotateY(0deg) rotateX(0deg) translateX(50%);
        }
        .stage.open .cover-front {
            transform: translateZ(calc(var(--book-t) / 2)) rotateY(-170deg);
        }
        .stage.open .inner-page {
            opacity: 1;
        }

        /* 결과 디자인 */
        .poster-img { width: 200px; height: 280px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .gungsuh { font-family: "Gungsuh", "궁서", serif; font-size: 1.8rem; text-align: center; line-height: 1.6; }
    </style>
</head>
<body>

<div class="ui-layer" id="ui">
    <h1>The Oracle</h1>
    <input type="text" id="question" class="input-box" placeholder="당신의 고민을 적으세요...">
    <br>
    <button class="btn-gold" onclick="openBook()">답변을 펼치다</button>
</div>

<div class="stage" id="bookStage">
    <!-- 1. 책등 -->
    <div class="book-part spine"></div>
    <!-- 2. 뒷표지 -->
    <div class="book-part cover-back"></div>
    <!-- 3. 옆면 (종이결) -->
    <div class="book-part side-paper side-right"></div>
    <div class="book-part side-paper side-top"></div>
    
    <!-- 4. 결과 페이지 (오른쪽) -->
    <div class="inner-page" style="z-index: 5; border-radius: 0 4px 4px 0;">
        <div id="res-msg" class="gungsuh"></div>
    </div>

    <!-- 5. 앞표지 + 결과 페이지 (왼쪽) -->
    <div class="book-part cover-front" id="front">
        <!-- 표지 디자인 -->
        <div id="cover-design" style="border: 1px solid #d4af37; padding: 40px; text-align: center;">
            <span style="letter-spacing: 8px; font-size: 0.8rem;">DRAMA</span>
            <h2 style="margin: 15px 0;">解答</h2>
            <span style="font-size: 0.7rem; opacity: 0.6;">The Book of Answers</span>
        </div>
        <!-- 펼쳤을 때 보일 왼쪽 페이지 내용 -->
        <div id="left-content" class="inner-page" style="transform: rotateY(180deg); width: 100%; height: 100%; top:0; left:0; border-radius: 4px 0 0 4px;">
            <img id="res-poster" src="" class="poster-img">
            <p id="res-title" style="margin-top: 15px; font-style: italic; color: #666;"></p>
        </div>
    </div>
</div>

<script>
    const db = [
        { t: "랑야방", m: "치밀하게 설계하고\n침묵으로 실행하라.", p: "https://via.placeholder.com/200x280/1c2a38/d4af37?text=Nirvana" },
        { t: "강철삼림", m: "결국 모든 것은 타이밍이다.\n망설이지 마라.", p: "https://via.placeholder.com/200x280/1c2a38/d4af37?text=Steel+Forest" },
        { t: "창란결", m: "때로는 차가운 거절이\n가장 큰 보호가 된다.", p: "https://via.placeholder.com/200x280/1c2a38/d4af37?text=Orchid" }
    ];

    function openBook() {
        const q = document.getElementById('question').value;
        if(!q) return alert("질문을 입력해주세요.");

        const res = db[Math.floor(Math.random() * db.length)];
        
        document.getElementById('res-poster').src = res.p;
        document.getElementById('res-title').innerText = res.t;
        document.getElementById('res-msg').innerText = `"${res.m}"`;

        // UI 숨기기 및 책 펼치기
        document.getElementById('ui').style.opacity = '0';
        document.getElementById('ui').style.pointerEvents = 'none';
        
        document.getElementById('bookStage').classList.add('open');
        
        // 표지 디자인 숨기고 내부 내용 보여주기
        setTimeout(() => {
            document.getElementById('cover-design').style.display = 'none';
            document.getElementById('left-content').style.opacity = '1';
        }, 300);
    }
</script>

</body>
</html>
