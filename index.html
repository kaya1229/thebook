<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Cinematic Oracle</title>
    <style>
        body, input, textarea, button { font-family: 'Pretendard', -apple-system, sans-serif; }
        .gungsuh { font-family: 'Gungsuh', '궁서', serif !important; }

        :root {
            --book-w: 340px; --book-h: 480px; --book-t: 64px;
            --cover-color: #161b22; --gold: #d4af37; --ivory: #fcf9f2;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        body {
            background-color: #050505; color: var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; perspective: 2500px; overflow: hidden;
        }

        @keyframes float {
            0% { transform: rotateY(-25deg) rotateX(12deg) translateY(0px); }
            50% { transform: rotateY(-20deg) rotateX(10deg) translateY(-20px); }
            100% { transform: rotateY(-25deg) rotateX(12deg) translateY(0px); }
        }

        .header-ui { position: absolute; top: 8%; text-align: center; z-index: 100; transition: 0.8s; }
        .input-box { background: transparent; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4); color: #fff; padding: 12px; width: 350px; text-align: center; font-size: 1.1rem; outline: none; margin-bottom: 20px; }
        .btn-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 18px; cursor: pointer; letter-spacing: 1px; transition: 0.4s; font-size: 0.85rem; margin: 5px; border-radius: 2px; }
        .btn-gold:hover { background: var(--gold); color: #000; }

        #manual-input-ui { display: none; margin-top: 15px; animation: fadeIn 0.5s; }
        .num-input { background: #111; border: 1px solid var(--gold); color: var(--gold); width: 60px; padding: 8px; text-align: center; font-size: 1rem; outline: none; }

        .book-container { 
            width: var(--book-w); height: var(--book-h); position: relative; transform-style: preserve-3d; 
            transition: 2.5s; animation: float 6s ease-in-out infinite; 
        }
        .book-container.active { animation: none; transform: rotateY(0deg) rotateX(0deg) translateZ(150px) translateX(50%) translateY(-10%); }

        .part { position: absolute; background: var(--cover-color); transform-style: preserve-3d; backface-visibility: hidden; }
        .front { width: 100%; height: 100%; transform: translateZ(calc(var(--book-t) / 2)); z-index: 10; transform-origin: left; transition: 2s; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); }
        .spine { width: var(--book-t); height: 100%; left: calc(var(--book-t) / -2); transform: rotateY(-90deg); background: #0c1117; }
        .side-paper { background: #e2ded0; width: calc(var(--book-t) - 2px); height: calc(100% - 4px); right: calc(var(--book-t) / -2); top: 2px; transform: rotateY(90deg); }
        
        /* 페이지 내용 초기 투명도 0 */
        .page-inner { position: absolute; width: 100%; height: 100%; background: var(--ivory); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; color: #1a1a1a; opacity: 0; transition: opacity 0.5s ease; }
        .left-content { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }
        .right-content { border-radius: 0 4px 4px 0; border-left: 1px solid rgba(0,0,0,0.1); }
        
        /* 활성화될 때 투명도 조절 (딜레이 추가) */
        .book-container.active .front { transform: translateZ(calc(var(--book-t) / 2)) rotateY(-175deg); }
        .book-container.active .page-inner { opacity: 1; transition: opacity 0.8s ease 1.2s; }

        #res-poster { max-width: 85%; max-height: 70%; filter: sepia(0.2) contrast(0.9) brightness(1.05); mix-blend-mode: multiply; opacity: 0.9; border: 1px solid rgba(0,0,0,0.1); }

        /* 관리자 패널 */
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 15, 15, 0.98); border: 1px solid var(--gold); padding: 25px; z-index: 1000; border-radius: 8px; width: 500px; max-height: 85vh; overflow-y: auto; color: #eee; box-shadow: 0 0 50px rgba(0,0,0,1); }
        .search-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 15px 0; max-height: 250px; overflow-y: auto; }
        .search-item { cursor: pointer; border: 2px solid transparent; border-radius: 4px; overflow: hidden; }
        .search-item img { width: 100%; display: block; object-fit: contain; }
        .search-item.selected { border-color: var(--gold); }
        
        /* 관리자 리스트 검색창 */
        .admin-list-search { width: 100%; padding: 8px; margin-bottom: 10px; background: #000; border: 1px solid #444; color: var(--gold); outline: none; }
        .pagination-ui { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 15px; }

        .admin-trigger { position: fixed; bottom: 0; right: 0; width: 40px; height: 40px; cursor: default; }
        #retry-btn { position: absolute; bottom: 8%; opacity: 0; pointer-events: none; transition: 1s; z-index: 200; }
        #retry-btn.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="header-ui" id="ui-main">
    <h1 style="font-weight: 300; letter-spacing: 5px;">THE ORACLE</h1>
    <input type="text" id="q-input" class="input-box" placeholder="무엇이 궁금하십니까?">
    <div id="main-btns">
        <button class="btn-gold" onclick="launch('random')">무작위의 해답</button>
        <button class="btn-gold" onclick="showManualInput()">직접 찾기</button>
    </div>
    <div id="manual-input-ui">
        <p id="limit-msg" style="font-size: 0.75rem; margin-bottom: 10px; opacity: 0.7;"></p>
        <input type="number" id="page-num" class="num-input">
        <button class="btn-gold" onclick="launch('manual')">펼치기</button>
    </div>
</div>

<div class="book-container" id="oracle-book">
    <div class="part spine"></div>
    <div class="part side-paper"></div>
    <div class="page-inner right-content">
        <div id="res-msg" class="gungsuh" style="font-size: 1.6rem; text-align: center; line-height: 1.7; word-break: keep-all; font-weight: bold;"></div>
    </div>
    <div class="part front">
        <div id="cover-art" style="text-align: center; border: 1px solid rgba(212,175,55,0.4); padding: 40px;">
            <h2 class="gungsuh" style="font-size: 2.8rem; margin: 0; letter-spacing: 8px;">解答</h2>
            <p style="font-style: italic; opacity: 0.5; margin-top: 10px; font-size: 0.8rem;">The Book of Destiny</p>
        </div>
        <div class="page-inner left-content">
            <img id="res-poster">
            <p id="res-title" style="margin-top: 20px; color: #666; font-size: 0.8rem;"></p>
        </div>
    </div>
</div>

<div id="retry-btn">
    <button class="btn-gold" onclick="resetOracle()">다시 질문하기</button>
</div>

<div class="admin-trigger" onclick="checkAdmin()"></div>

<div id="admin-panel">
    <h3 id="admin-title" style="color: var(--gold); font-weight: 400;">ADMIN CONSOLE</h3>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="tmdb-query" placeholder="드라마 제목 검색..." style="flex:1; padding:8px; background:#222; border:1px solid #444; color:#fff; outline: none;">
        <button class="btn-gold" onclick="searchTMDB()" style="margin:0;">검색</button>
    </div>
    <div id="search-results" class="search-results"></div>
    <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
    
    <input type="hidden" id="edit-id">
    <input type="text" id="selected-title" placeholder="선택된 드라마" readonly style="width:100%; margin-bottom:10px; padding:10px; background:#111; border:1px solid #333; color:var(--gold); box-sizing: border-box;">
    <input type="hidden" id="selected-poster">
    <textarea id="manual-answer" placeholder="해답 문구를 입력하세요..." rows="3" style="width:100%; margin-bottom:10px; padding:10px; background:#222; border:1px solid #444; color:#fff; box-sizing: border-box; outline: none;"></textarea>
    
    <div style="display:flex; gap:10px;">
        <button class="btn-gold" style="flex:1" onclick="handleSave()">데이터 저장</button>
        <button class="btn-gold" style="flex:1; border-color:#444;" onclick="resetAdminForm()">초기화</button>
    </div>

    <!-- 저장된 기록 섹션 -->
    <div style="margin-top:25px; border-top:1px solid var(--gold); padding-top:15px;">
        <p style="font-size:0.8rem; color:var(--gold); margin-bottom:8px;">SAVED RECORDS</p>
        <input type="text" id="admin-list-search" class="admin-list-search" placeholder="저장된 제목 검색..." oninput="currentPage=1; renderAdminList();">
        <div id="list-container"></div>
        <div class="pagination-ui">
            <button class="btn-gold" style="padding:4px 10px;" onclick="changePage(-1)">이전</button>
            <span id="page-info" style="font-size:0.8rem;">1 / 1</span>
            <button class="btn-gold" style="padding:4px 10px;" onclick="changePage(1)">다음</button>
        </div>
    </div>
    <button class="btn-gold" style="width:100%; margin-top:20px; border-color:#444;" onclick="document.getElementById('admin-panel').style.display='none'">닫기</button>
</div>

<script>
    let dataPool = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    window.onload = loadData;

    async function loadData() {
        const res = await fetch('/api/dramas');
        dataPool = await res.json();
        renderAdminList();
    }

    function checkAdmin() { if (prompt("PASSCODE") === "1234") document.getElementById('admin-panel').style.display='block'; }

    function launch(mode) {
        if (!document.getElementById('q-input').value) return alert("질문을 적어주세요.");
        let result;
        if (mode === 'random') {
            result = dataPool[Math.floor(Math.random() * dataPool.length)];
        } else {
            const num = parseInt(document.getElementById('page-num').value);
            if (isNaN(num) || num < 1 || num > dataPool.length) return alert("유효한 숫자를 입력하세요.");
            result = [...dataPool].sort((a,b) => a.id - b.id)[num - 1];
        }

        document.getElementById('res-poster').src = result.poster_url;
        document.getElementById('res-title').innerText = result.title;
        document.getElementById('res-msg').innerText = result.answer;

        document.getElementById('ui-main').style.opacity = '0';
        document.getElementById('oracle-book').classList.add('active');
        document.getElementById('retry-btn').classList.add('show');
        setTimeout(() => { document.getElementById('cover-art').style.visibility = 'hidden'; }, 1500);
    }

    function resetOracle() {
        // [수정] 닫힐 때 내용이 안 보이도록 투명도 즉시 제거
        const pages = document.querySelectorAll('.page-inner');
        pages.forEach(p => p.style.opacity = '0');

        document.getElementById('oracle-book').classList.remove('active');
        document.getElementById('retry-btn').classList.remove('show');
        document.getElementById('ui-main').style.opacity = '1';
        
        setTimeout(() => { 
            document.getElementById('cover-art').style.visibility = 'visible';
            document.getElementById('q-input').value = "";
            document.getElementById('page-num').value = "";
            document.getElementById('manual-input-ui').style.display = 'none';
            document.getElementById('main-btns').style.display = 'block';
            // 모션 완료 후 투명도 설정 원복 (다음 질문을 위해)
            pages.forEach(p => p.style.opacity = ''); 
        }, 1200);
    }

    // [관리자 - 리스트 렌더링 및 페이징]
    function renderAdminList() {
        const searchTerm = document.getElementById('admin-list-search').value.toLowerCase();
        const filteredData = dataPool.filter(item => item.title.toLowerCase().includes(searchTerm));
        
        const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * itemsPerPage;
        const pagedData = filteredData.slice(start, start + itemsPerPage);

        document.getElementById('page-info').innerText = `${currentPage} / ${totalPages}`;
        document.getElementById('list-container').innerHTML = pagedData.map(item => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:8px; margin-bottom:5px; font-size:0.85rem; border-left: 2px solid #333;">
                <span onclick="editItem('${item.id}')" style="cursor:pointer; color:var(--gold); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:10px;">${item.title}</span>
                <button onclick="deleteItem('${item.id}')" style="color:#666; background:none; border:none; cursor:pointer; font-size:0.7rem;">삭제</button>
            </div>
        `).join('');
    }

    function changePage(direction) {
        currentPage += direction;
        const searchTerm = document.getElementById('admin-list-search').value.toLowerCase();
        const filteredData = dataPool.filter(item => item.title.toLowerCase().includes(searchTerm));
        const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
        
        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;
        renderAdminList();
    }

    // [관리자 - TMDB 검색 및 저장]
    async function searchTMDB() {
        const q = document.getElementById('tmdb-query').value;
        if(!q) return;
        const res = await fetch(`/api/search?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        document.getElementById('search-results').innerHTML = data.results.slice(0, 6).map(item => `
            <div class="search-item" onclick="selectDrama('${(item.title || item.name).replace(/'/g, "\\'")}', '${item.poster_path}')">
                <img src="https://image.tmdb.org/t/p/w200${item.poster_path}">
            </div>
        `).join('');
    }

    function selectDrama(t, p) {
        document.getElementById('selected-title').value = t;
        document.getElementById('selected-poster').value = `https://image.tmdb.org/t/p/w500${p}`;
        document.querySelectorAll('.search-item').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    async function handleSave() {
        const id = document.getElementById('edit-id').value;
        const title = document.getElementById('selected-title').value;
        const poster_url = document.getElementById('selected-poster').value;
        const answer = document.getElementById('manual-answer').value;
        if (!title || !answer) return alert("내용을 입력하세요.");

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/dramas?id=${id}` : '/api/dramas';
        const res = await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ title, answer, poster_url })
        });

        if (res.ok) {
            alert("저장되었습니다.");
            resetAdminForm();
            loadData();
        }
    }

    function editItem(id) {
        const item = dataPool.find(d => d.id == id);
        if (!item) return;
        document.getElementById('edit-id').value = item.id;
        document.getElementById('selected-title').value = item.title;
        document.getElementById('selected-poster').value = item.poster_url;
        document.getElementById('manual-answer').value = item.answer;
        document.getElementById('admin-title').innerText = "ADMIN: EDIT MODE";
        window.scrollTo({top:0, behavior:'smooth'});
    }

    async function deleteItem(id) {
        if(confirm("삭제하시겠습니까?")) {
            await fetch(`/api/dramas?id=${id}`, { method: 'DELETE' });
            loadData();
        }
    }

    function resetAdminForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('selected-title').value = "";
        document.getElementById('selected-poster').value = "";
        document.getElementById('manual-answer').value = "";
        document.getElementById('tmdb-query').value = "";
        document.getElementById('search-results').innerHTML = "";
        document.getElementById('admin-title').innerText = "ADMIN CONSOLE";
    }

    function showManualInput() {
        if (!document.getElementById('q-input').value) return alert("질문을 적어주세요.");
        document.getElementById('main-btns').style.display = 'none';
        document.getElementById('manual-input-ui').style.display = 'block';
        document.getElementById('limit-msg').innerText = `1 ~ ${dataPool.length} 페이지 중 선택`;
    }
</script>
</body>
</html>
