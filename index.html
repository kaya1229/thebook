<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Cinematic Oracle</title>
    <style>
        body, input, textarea, button, h1, h2, h3 { font-family: 'Gungsuh', '궁서', 'AppleMyungjo', serif; }
        :root {
            --book-w: 340px; --book-h: 480px; --book-t: 64px;
            --cover-color: #161b22; --gold: #d4af37; --ivory: #fcf9f2;
        }

        body {
            background-color: #050505; color: var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; perspective: 2500px; overflow: hidden;
        }

        /* 공중에 둥둥 떠다니는 효과 */
        @keyframes float {
            0% { transform: rotateY(-25deg) rotateX(12deg) translateY(0px); }
            50% { transform: rotateY(-20deg) rotateX(10deg) translateY(-20px); }
            100% { transform: rotateY(-25deg) rotateX(12deg) translateY(0px); }
        }

        .header-ui { position: absolute; top: 8%; text-align: center; z-index: 100; transition: 0.8s; }
        .input-box { background: transparent; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4); color: #fff; padding: 12px; width: 350px; text-align: center; font-size: 1.1rem; outline: none; margin-bottom: 20px; }
        .btn-gold { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 10px 20px; cursor: pointer; letter-spacing: 2px; transition: 0.4s; font-size: 0.8rem; margin: 5px; }
        .btn-gold:hover { background: var(--gold); color: #000; }

        /* [새로운 숫자 입력 UI] */
        #manual-input-ui { display: none; margin-top: 15px; animation: fadeIn 0.5s; }
        .num-input { background: #111; border: 1px solid var(--gold); color: var(--gold); width: 80px; padding: 8px; text-align: center; font-size: 1.2rem; outline: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* 3D 책 구조 및 애니메이션 */
        .book-container { 
            width: var(--book-w); height: var(--book-h); position: relative; transform-style: preserve-3d; 
            transition: 2.5s; animation: float 6s ease-in-out infinite; 
            box-shadow: 20px 20px 60px rgba(0,0,0,0.8);
        }
        .book-container.active { animation: none; transform: rotateY(0deg) rotateX(0deg) translateZ(150px) translateX(50%) translateY(-10%); }

        .part { position: absolute; background: var(--cover-color); transform-style: preserve-3d; backface-visibility: hidden; border-radius: 2px 4px 4px 2px; }
        .front { width: 100%; height: 100%; transform: translateZ(calc(var(--book-t) / 2)); z-index: 10; transform-origin: left; transition: 2s; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(212,175,55,0.2); }
        .spine { width: var(--book-t); height: 100%; left: calc(var(--book-t) / -2); transform: rotateY(-90deg); background: #0c1117; border-left: 2px solid var(--gold); }
        .side-paper { background: #e2ded0; width: calc(var(--book-t) - 2px); height: calc(100% - 4px); right: calc(var(--book-t) / -2); top: 2px; transform: rotateY(90deg); background-image: linear-gradient(90deg, #e2ded0 90%, #bbb 100%); }
        
        .page-inner { position: absolute; width: 100%; height: 100%; background: var(--ivory); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; box-sizing: border-box; color: #1a1a1a; opacity: 0; transition: opacity 0.8s ease 1.2s; box-shadow: inset 0 0 50px rgba(0,0,0,0.05); }
        .left-content { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }
        .right-content { border-radius: 0 4px 4px 0; border-left: 1px solid rgba(0,0,0,0.1); }
        .book-container.active .front { transform: translateZ(calc(var(--book-t) / 2)) rotateY(-175deg); }
        .book-container.active .page-inner { opacity: 1; }

        /* 관리자 패널 */
        #admin-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 10, 0.98); border: 1px solid var(--gold); padding: 25px; z-index: 1000; border-radius: 12px; width: 500px; max-height: 85vh; overflow-y: auto; color: #eee; }
        .search-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; max-height: 180px; overflow-y: auto; background: #111; padding: 10px; }
        .search-item { cursor: pointer; border: 2px solid transparent; text-align: center; font-size: 0.7rem; }
        .search-item.selected { border-color: var(--gold); }
        .search-item img { width: 100%; border-radius: 4px; }
        .admin-trigger { position: fixed; bottom: 0; right: 0; width: 40px; height: 40px; cursor: default; }

        #retry-btn { position: absolute; bottom: 8%; opacity: 0; pointer-events: none; transition: 1s; z-index: 200; }
        #retry-btn.show { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body>

<div class="header-ui" id="ui-main">
    <h1>The Oracle</h1>
    <input type="text" id="q-input" class="input-box" placeholder="무엇이 궁금하십니까?">
    <div id="main-btns">
        <button class="btn-gold" onclick="launch('random')">무작위의 해답</button>
        <button class="btn-gold" onclick="showManualInput()">직접 찾기</button>
    </div>
    <!-- [직접 입력 UI 영역] -->
    <div id="manual-input-ui">
        <p id="limit-msg" style="font-size: 0.8rem; margin-bottom: 8px;"></p>
        <input type="number" id="page-num" class="num-input" placeholder="0">
        <button class="btn-gold" onclick="launch('manual')">열기</button>
    </div>
</div>

<div class="book-container" id="oracle-book">
    <div class="part spine"></div>
    <div class="part side-paper"></div>
    <div class="page-inner right-content"><div id="res-msg" style="font-size: 1.5rem; text-align: center; line-height: 1.6; word-break: keep-all;"></div></div>
    <div class="part front">
        <div id="cover-art" style="text-align: center; border: 1px solid var(--gold); padding: 40px; background: rgba(255,255,255,0.03);">
            <h2 style="font-size: 2.5rem; font-weight: 300; margin: 0;">解答</h2>
            <p style="font-style: italic; opacity: 0.6; margin-top: 10px;">The Book of Destiny</p>
        </div>
        <div class="page-inner left-content">
            <img id="res-poster" style="max-width: 85%; max-height: 70%; border: 3px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <p id="res-title" style="margin-top: 15px; font-style: italic; color: #888; font-size: 0.9rem;"></p>
        </div>
    </div>
</div>

<div id="retry-btn">
    <button class="btn-gold" onclick="resetOracle()">다시 질문하기</button>
</div>

<div class="admin-trigger" onclick="checkAdmin()"></div>

<div id="admin-panel">
    <h3 id="admin-title" style="color: var(--gold); margin-top: 0;">ADMIN: 등록 모드</h3>
    <input type="text" id="tmdb-query" placeholder="드라마 제목 검색..." style="width:70%; padding:8px; background:#222; border:1px solid #444; color:#fff;">
    <button class="btn-gold" onclick="searchTMDB()">검색</button>
    
    <div id="search-results" class="search-results"></div>
    
    <input type="hidden" id="edit-id">
    <input type="text" id="selected-title" placeholder="선택된 드라마 제목" readonly style="width:100%; margin:10px 0; padding:10px; background:#111; border:1px solid var(--gold); color:var(--gold);">
    <input type="hidden" id="selected-poster">
    <textarea id="manual-answer" placeholder="이 드라마와 매칭될 '해답 문구'를 입력하세요." rows="4" style="width:100%; margin-bottom:15px; padding:10px; background:#222; border:1px solid #444; color:#fff;"></textarea>
    
    <div style="display:flex; gap:10px;">
        <button class="btn-gold" style="flex:1" onclick="handleSave()">저장/수정</button>
        <button class="btn-gold" style="flex:1; border-color:#666;" onclick="resetAdminForm()">초기화</button>
    </div>

    <div id="list-container" style="margin-top:25px; border-top:1px solid #333; padding-top:15px;"></div>
    <button class="btn-gold" style="width:100%; margin-top:15px; border-color:#444;" onclick="document.getElementById('admin-panel').style.display='none'">콘솔 닫기</button>
</div>

<script>
    let dataPool = [];

    window.onload = loadData;

    async function loadData() {
        const res = await fetch('/api/dramas');
        dataPool = await res.json();
        renderAdminList();
    }

    function checkAdmin() { if (prompt("ACCESS CODE") === "1234") document.getElementById('admin-panel').style.display='block'; }

    // [직접 입력 UI 표시]
    function showManualInput() {
        if (!document.getElementById('q-input').value) return alert("먼저 고민을 적으셔야 합니다.");
        document.getElementById('main-btns').style.display = 'none';
        document.getElementById('manual-input-ui').style.display = 'block';
        document.getElementById('limit-msg').innerText = `1 ~ ${dataPool.length} 사이의 숫자를 입력하세요.`;
    }

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function launch(mode) {
        const q = document.getElementById('q-input').value;
        if (!q) return alert("당신의 고민을 먼저 적어주세요.");
        
        let result;
        if (mode === 'random') {
            result = dataPool[Math.floor(Math.random() * dataPool.length)];
        } else {
            const num = parseInt(document.getElementById('page-num').value);
            if (isNaN(num) || num < 1 || num > dataPool.length) {
                return alert(`1부터 ${dataPool.length} 사이의 숫자를 넣어주세요.`);
            }
            const shuffledPool = shuffle([...dataPool]);
            result = shuffledPool[num - 1];
        }

        document.getElementById('res-poster').src = result.poster_url;
        document.getElementById('res-title').innerText = result.title;
        document.getElementById('res-msg').innerText = result.answer;

        document.getElementById('ui-main').style.opacity = '0';
        document.getElementById('oracle-book').classList.add('active');
        document.getElementById('retry-btn').classList.add('show');
        setTimeout(() => { document.getElementById('cover-art').style.visibility = 'hidden'; }, 1500);
    }

    function resetOracle() {
        document.getElementById('q-input').value = "";
        document.getElementById('page-num').value = "";
        document.getElementById('manual-input-ui').style.display = 'none';
        document.getElementById('main-btns').style.display = 'block';
        document.getElementById('oracle-book').classList.remove('active');
        document.getElementById('retry-btn').classList.remove('show');
        document.getElementById('ui-main').style.opacity = '1';
        setTimeout(() => { document.getElementById('cover-art').style.visibility = 'visible'; }, 1000);
    }

    // [관리자 - 수정 기능 복구]
    function editItem(id) {
        const item = dataPool.find(d => d.id === id);
        if (!item) return;
        document.getElementById('edit-id').value = item.id;
        document.getElementById('selected-title').value = item.title;
        document.getElementById('selected-poster').value = item.poster_url;
        document.getElementById('manual-answer').value = item.answer;
        document.getElementById('admin-title').innerText = "ADMIN: 수정 모드";
        document.getElementById('admin-panel').scrollTo(0,0);
    }

    function resetAdminForm() {
        document.getElementById('edit-id').value = "";
        document.getElementById('selected-title').value = "";
        document.getElementById('selected-poster').value = "";
        document.getElementById('manual-answer').value = "";
        document.getElementById('admin-title').innerText = "ADMIN: 등록 모드";
        document.querySelectorAll('.search-item').forEach(el => el.classList.remove('selected'));
    }

    async function handleSave() {
        const id = document.getElementById('edit-id').value;
        const title = document.getElementById('selected-title').value;
        const poster_url = document.getElementById('selected-poster').value;
        const answer = document.getElementById('manual-answer').value;

        if (!title || !answer) return alert("내용을 채워주세요.");

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/dramas?id=${id}` : '/api/dramas';

        await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({title, answer, poster_url})
        });
        
        alert(id ? "수정되었습니다." : "저장되었습니다.");
        resetAdminForm();
        loadData();
    }

    async function searchTMDB() {
        const q = document.getElementById('tmdb-query').value;
        const res = await fetch(`/api/search?query=${encodeURIComponent(q)}`);
        const data = await res.json();
        document.getElementById('search-results').innerHTML = data.results.map(item => `
            <div class="search-item" onclick="selectDrama('${item.title || item.name}', '${item.poster_path}')">
                <img src="https://image.tmdb.org/t/p/w200${item.poster_path}">
                <p style="margin:5px 0;">${item.title || item.name}</p>
            </div>
        `).join('');
    }

    function selectDrama(t, p) {
        document.getElementById('selected-title').value = t;
        document.getElementById('selected-poster').value = `https://image.tmdb.org/t/p/w500${p}`;
        document.querySelectorAll('.search-item').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function renderAdminList() {
        document.getElementById('list-container').innerHTML = dataPool.map(item => `
            <div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:8px; margin-bottom:5px; border-radius:4px;">
                <span onclick="editItem('${item.id}')" style="cursor:pointer; color:var(--gold); flex:1;">${item.title}</span>
                <button onclick="deleteItem('${item.id}')" style="color:#ff4444; background:none; border:none; cursor:pointer; margin-left:10px;">삭제</button>
            </div>
        `).join('');
    }

    async function deleteItem(id) {
        if(confirm("정말 삭제할까요?")) { await fetch(`/api/dramas?id=${id}`, {method:'DELETE'}); loadData(); }
    }
</script>
</body>
</html>
