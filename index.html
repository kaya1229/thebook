<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>The Floating Oracle of Dramas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:italic&family=Noto+Serif+KR:wght@300;700&display=swap');

        :root {
            --book-w: 320px;
            --book-h: 460px;
            --book-t: 60px;
            --cover-color: #121d29;
            --gold: #d4af37;
            --ivory: #fdfaf2;
        }

        body {
            background-color: #050505;
            color: var(--gold);
            font-family: 'Noto Serif KR', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* 상단부터 배치하여 입력창 공간 확보 */
            height: 100vh;
            margin: 0;
            perspective: 2000px;
            overflow: hidden;
            padding-top: 5vh;
        }

        /* 1. 지적인 입력 영역 (책과 겹치지 않게 상단 고정) */
        .ui-header {
            text-align: center;
            z-index: 100;
            margin-bottom: 80px; /* 책과의 간격 확보 */
            transition: opacity 1s;
        }

        h1 { font-family: 'Libre Baskerville', serif; font-size: 2rem; letter-spacing: 5px; margin-bottom: 20px; }
        
        .input-wrapper { margin-bottom: 25px; }
        .input-box {
            background: transparent; border: none; border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            color: #fff; padding: 12px; width: 320px; text-align: center; font-size: 1.1rem; outline: none;
        }

        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn-oracle {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 12px 20px; cursor: pointer; letter-spacing: 1px; transition: 0.4s; font-size: 0.85rem;
        }
        .btn-oracle:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        /* 2. 둥둥 떠있는 효과 (Floating & Glowing) */
        @keyframes float {
            0% { transform: translateY(0px) rotateY(-25deg) rotateX(10deg); }
            50% { transform: translateY(-20px) rotateY(-20deg) rotateX(15deg); }
            100% { transform: translateY(0px) rotateY(-25deg) rotateX(10deg); }
        }

        .book-stage {
            width: var(--book-w);
            height: var(--book-h);
            position: relative;
            transform-style: preserve-3d;
            animation: float 4s ease-in-out infinite; /* 부유 애니메이션 */
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1), animation 1s;
        }

        /* 책의 은은한 빛(Glow) */
        .book-stage::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.15);
            transform: translateZ(-30px); filter: blur(20px);
        }

        /* 3. 책의 물리적 구조 */
        .part { position: absolute; background: var(--cover-color); transform-style: preserve-3d; backface-visibility: hidden; }

        .front {
            width: 100%; height: 100%; transform: translateZ(calc(var(--book-t) / 2));
            z-index: 10; border-radius: 0 4px 4px 0; border: 1px solid rgba(212, 175, 55, 0.2);
            transform-origin: left; transition: transform 1.5s ease-in-out;
            display: flex; align-items: center; justify-content: center;
        }

        .spine {
            width: var(--book-t); height: 100%; left: calc(var(--book-t) / -2);
            transform: rotateY(-90deg); background: #0d161f;
        }

        .side-paper {
            background: #eee; background-image: linear-gradient(90deg, #ddd 1px, transparent 1px); background-size: 2px 100%;
            width: var(--book-t); height: calc(100% - 4px); right: calc(var(--book-t) / -2); top: 2px;
            transform: rotateY(90deg);
        }

        /* 4. 내부 페이지 (열렸을 때) */
        .page-inner {
            position: absolute; width: 100%; height: 100%; background: var(--ivory);
            display: flex; flex-direction: column; align-items: center; justify-content: center; /* 중앙 정렬 */
            padding: 40px; box-sizing: border-box; color: #111; opacity: 0; transition: opacity 0.5s ease 0.8s;
        }

        .left-page-content {
            transform: rotateY(180deg); transform-origin: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center; /* 포스터 중앙 정렬 */
        }

        /* 펼쳐진 상태 */
        .book-stage.open {
            animation: none; /* 부유 멈춤 */
            transform: rotateY(0deg) rotateX(0deg) translateX(50%) translateY(50px);
        }
        .book-stage.open .front { transform: translateZ(calc(var(--book-t) / 2)) rotateY(-170deg); }
        .book-stage.open .page-inner { opacity: 1; }

        /* 결과물 디테일 */
        .res-poster { max-width: 100%; max-height: 300px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .res-answer { font-family: "Gungsuh", "궁서", serif; font-size: 1.8rem; text-align: center; line-height: 1.5; word-break: keep-all; }
        
        #page-input-modal { display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="ui-header" id="ui-header">
    <h1>The Oracle</h1>
    <div class="input-wrapper">
        <input type="text" id="user-q" class="input-box" placeholder="당신의 고민은 무엇인가요?">
    </div>
    <div class="btn-group" id="btn-group">
        <button class="btn-oracle" onclick="startProcess('random')">운명에 맡기기</button>
        <button class="btn-oracle" onclick="showManual()">직접 페이지 선택</button>
    </div>
    <div id="page-input-modal">
        <input type="number" id="manual-page" placeholder="1-500" style="background:none; border:1px solid var(--gold); color:#fff; width:60px; padding:10px;">
        <button class="btn-oracle" onclick="startProcess('manual')">펼치기</button>
    </div>
</div>

<div class="book-stage" id="book">
    <div class="part spine"></div>
    <div class="part side-paper"></div>
    
    <!-- 오른쪽 페이지 (해답) -->
    <div class="page-inner" style="right: 0; z-index: 5; border-radius: 0 4px 4px 0; border-left: 1px solid #ddd;">
        <div id="res-msg" class="res-answer"></div>
    </div>

    <!-- 앞표지 레이어 -->
    <div class="part front" id="front-cover">
        <!-- 표지 디자인 -->
        <div id="cover-ui" style="text-align: center; border: 1px solid var(--gold); padding: 40px;">
            <p style="letter-spacing: 5px; font-size: 0.7rem;">THE COLLECTED</p>
            <h2 style="font-size: 2.5rem; margin: 15px 0;">解答</h2>
            <p style="font-style: italic; opacity: 0.7;">Book of Drama Answers</p>
        </div>
        <!-- 왼쪽 페이지 (포스터 - 정중앙) -->
        <div id="left-page" class="page-inner left-page-content" style="position: absolute; width:100%; height:100%; top:0; left:0; border-radius: 4px 0 0 4px;">
            <img id="res-poster" src="" class="res-poster">
            <p id="res-title" style="font-style: italic; color: #777;"></p>
        </div>
    </div>
</div>

<button id="reset-btn" onclick="location.reload()" style="display:none; margin-top:50px;" class="btn-oracle">다시 질문하기</button>

<script>
    const library = [
        { t: "랑야방", a: "치밀하게 설계하고\n침묵으로 실행하라.", p: "https://via.placeholder.com/220x300/121d29/d4af37?text=Nirvana" },
        { t: "강철삼림", a: "결국 모든 것은 타이밍이다.\n망설이지 마라.", p: "https://via.placeholder.com/220x300/121d29/d4af37?text=Steel+Forest" },
        { t: "창란결", a: "때로는 차가운 거절이\n가장 큰 보호가 된다.", p: "https://via.placeholder.com/220x300/121d29/d4af37?text=Orchid" },
        { t: "미생", a: "죽어있는 수라면\n과감히 버려라.", p: "https://via.placeholder.com/220x300/121d29/d4af37?text=Misaeng" }
    ];

    function showManual() {
        document.getElementById('btn-group').style.display = 'none';
        document.getElementById('page-input-modal').style.display = 'block';
    }

    function startProcess(mode) {
        const q = document.getElementById('user-q').value;
        if(!q) return alert("당신의 고민을 먼저 들려주세요.");

        // 매번 랜덤하게 섞기
        const shuffled = [...library].sort(() => Math.random() - 0.5);
        
        let pageNum = mode === 'random' ? Math.floor(Math.random() * 500) : document.getElementById('manual-page').value;
        const result = shuffled[pageNum % shuffled.length];

        // 결과 세팅
        document.getElementById('res-poster').src = result.p;
        document.getElementById('res-title').innerText = result.t;
        document.getElementById('res-msg').innerText = `"${result.a}"`;

        // 애니메이션 시작
        document.getElementById('ui-header').style.opacity = '0.1';
        document.getElementById('ui-header').style.pointerEvents = 'none';
        document.getElementById('book').classList.add('open');

        setTimeout(() => {
            document.getElementById('cover-ui').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'block';
        }, 800);
    }
</script>

</body>
</html>
