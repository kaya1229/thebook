<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드라마 해답의 책</title>
    <style>
        :root {
            --book-color: #2c3e50;
            --page-color: #fdfdfd;
        }

        body {
            background-color: #121212;
            color: #eee;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 50px;
            overflow-x: hidden;
        }

        .container { text-align: center; width: 100%; max-width: 900px; z-index: 2; }

        /* 입력 섹션 */
        .input-section { margin-bottom: 30px; transition: opacity 0.5s; }
        input[type="text"] {
            width: 70%; padding: 15px; border: none; border-bottom: 2px solid #555;
            background: transparent; color: #fff; font-size: 1.2rem; text-align: center; outline: none;
        }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        button {
            padding: 12px 24px; background: #333; color: #fff; border: 1px solid #555;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #eee; color: #000; }

        /* 책 레이아웃 */
        .book-scene {
            perspective: 2000px;
            width: 400px;
            height: 500px;
            margin: 40px auto;
            position: relative;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: default;
        }

        /* 책의 각 면 */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: var(--page-color);
            color: #222;
            box-shadow: inset 3px 0px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            backface-visibility: hidden; /* 뒷면 숨김 */
        }

        /* 표지 (겉면) */
        .cover {
            background: var(--book-color);
            color: #f1c40f;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 0 5px 5px 0;
            z-index: 5;
            transform-origin: left;
            transition: transform 1.5s;
        }

        /* 내부 결과 페이지 (왼쪽/오른쪽) */
        .page-content-left { 
            transform: rotateY(-180deg); /* 미리 뒤집어둠 */
            transform-origin: right;
            border-radius: 5px 0 0 5px;
            z-index: 4;
        }
        
        .page-content-right {
            z-index: 3;
            border-radius: 0 5px 5px 0;
        }

        /* 애니메이션 실행 시 클래스 */
        .book.open .cover { transform: rotateY(-180deg); }
        .book.open .page-content-left { transform: rotateY(0deg); left: -100%; }

        /* 결과 스타일 */
        .poster { width: 80%; max-height: 300px; object-fit: cover; box-shadow: 10px 10px 20px rgba(0,0,0,0.3); }
        .drama-title { margin-top: 15px; font-size: 1rem; color: #777; }
        .answer-text {
            font-family: "Gungsuh", "궁서", serif;
            font-size: 1.8rem;
            line-height: 1.6;
            text-align: center;
            word-break: keep-all;
        }

        #page-input-modal { display: none; margin-top: 15px; }
        #page-number { width: 100px; padding: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="input-section" id="ui-top">
        <h1>드라마 해답의 책</h1>
        <input type="text" id="user-question" placeholder="고민을 입력하세요...">
        <div class="btn-group">
            <button onclick="handleAction('random')">랜덤으로 펼치기</button>
            <button onclick="showPageInput()">직접 페이지 입력</button>
        </div>
        <div id="page-input-modal">
            <input type="number" id="page-number" placeholder="1-500" min="1" max="500">
            <button onclick="handleAction('manual')">확인</button>
        </div>
    </div>

    <!-- 책 오브젝트 -->
    <div class="book-scene">
        <div class="book" id="main-book">
            <!-- 표지 -->
            <div class="page cover" id="book-cover">
                <div style="border: 2px solid #f1c40f; padding: 20px;">解答</div>
            </div>
            
            <!-- 왼쪽 페이지 (결과: 드라마 포스터) -->
            <div class="page page-content-left">
                <img id="res-poster" src="" alt="포스터" class="poster">
                <div id="res-title" class="drama-title"></div>
            </div>

            <!-- 오른쪽 페이지 (결과: 해답 문구) -->
            <div class="page page-content-right">
                <div id="res-answer" class="answer-text"></div>
            </div>
        </div>
    </div>
    
    <button id="reset-btn" onclick="location.reload()" style="display:none; margin-top: 20px;">다시 물어보기</button>
</div>

<script>
    const dramaData = [
        { title: "랑야방", answer: "치밀하게 설계하고\n침묵으로 실행하라.", poster: "https://via.placeholder.com/240x350?text=Nirvana+In+Fire" },
        { title: "강철삼림", answer: "결국 모든 것은 타이밍이다.\n망설이지 마라.", poster: "https://via.placeholder.com/240x350?text=Steel+Forest" },
        { title: "창란결", answer: "본능에 몸을 맡기고\n운명을 뒤집어라.", poster: "https://via.placeholder.com/240x350?text=Orchid+Magic" },
        { title: "미생", answer: "죽어있는 수라면\n과감히 버려라.", poster: "https://via.placeholder.com/240x350?text=Misaeng" },
        { title: "나의 아저씨", answer: "아무것도 아니다.\n네가 그렇게 믿으면 된다.", poster: "https://via.placeholder.com/240x350?text=My+Mister" }
    ];

    function showPageInput() {
        document.getElementById('page-input-modal').style.display = 'block';
    }

    function handleAction(mode) {
        const q = document.getElementById('user-question').value;
        if (!q) { alert("고민을 입력해주세요!"); return; }

        let pageNum;
        if (mode === 'random') {
            pageNum = Math.floor(Math.random() * 500) + 1;
        } else {
            pageNum = document.getElementById('page-number').value;
            if (!pageNum) return;
        }

        // 데이터 섞기 및 결과 추출
        const shuffled = [...dramaData].sort(() => Math.random() - 0.5);
        const result = shuffled[pageNum % shuffled.length];

        // 결과 삽입
        document.getElementById('res-poster').src = result.poster;
        document.getElementById('res-title').innerText = result.title;
        document.getElementById('res-answer').innerText = `"${result.answer}"`;

        // 애니메이션 실행
        openBook();
    }

    function openBook() {
        document.getElementById('ui-top').style.opacity = '0.3';
        document.getElementById('ui-top').style.pointerEvents = 'none';
        
        const book = document.getElementById('main-book');
        book.classList.add('open');

        setTimeout(() => {
            document.getElementById('reset-btn').style.display = 'inline-block';
        }, 1500);
    }
</script>

</body>
</html>
